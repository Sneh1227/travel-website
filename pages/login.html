<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>

<body>
    <div class="card-container">
        <img src="/assets/images/header/Logo.png" alt="logo" />
        <div class="login-card">
            <div class="top">
                <a href="/index.html"><button class="backarrow"><i class="fa-solid fa-arrow-left"></i></button></a>
                <header>
                    <h1>LOGIN</h1>
                    <p>Welcome back traveler</p>
                </header>
            </div>
            <form id="loginForm" method="post">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="email" />
                    <span id="emailError"></span>
                </div>
                <div class="input-group">
                    <label for="pass">Password</label>
                    <input type="password" id="pass" class="password" />
                    <div class="pass-box">
                        <button type="button" class="btn" id="togglepass">
                            <i class="fa-regular fa-eye-slash" style="color: rgb(255, 212, 59);"></i>
                        </button>
                    </div>
                    <span id="passError"></span>
                </div>
                <button type="submit" class="btnlogin">LOGIN</button>
            </form>
            <footer>
                <p>Don't have an account? <a href="signup.html">signup</a></p>
            </footer>
        </div>
    </div>
    <script></script>
    <script src="/js/login.js"></script>
</body>

</html>
