<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/signup.css">
</head>

<body>
    <div class="card-container">
        <img src="/assets/images/header/Logo.png" alt="logo" />
        <div class="signup-card">
            <header>
                <div class="main-head">
                    <a href="/index.html"><button><i class="fa-solid fa-arrow-left"></i></button></a>
                    <h1>SIGN UP</h1>
                </div>
                <p>Please fill all the details properly</p>
            </header>
            <form id="formsignup">
                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" class="firstname" minlength="2" maxlength="15" required />
                    <span id="nameError"></span>
                </div>
                <div class="input-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" class="lastname" required minlength="2" maxlength="15"/>
                    <span id="lastError"></span>
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="email" required maxlength="25"/>
                    <span id="emailError"></span>
                </div>
                <div class="input-group">
                    <label for="pass">Password</label>
                    <div class="pass-box">
                        <input type="password" id="pass" class="pass" required />
                        <button type="button" id="togglepass">
                            <i class="fa-regular fa-eye-slash" style="color: rgb(246, 246, 245);"></i>
                        </button>
                    </div>
                    <span id="passError"></span>
                </div>
                <div class="input-group">
                    <label for="confirmpass">Confirm Password</label>
                    <div class="pass-box">
                        <input type="password" id="confirmpassword" class="confirmpassword" required />
                        <button type="button" id="toggleconfirmpass">
                            <i class="fa-regular fa-eye-slash" style="color: rgb(248, 247, 246);"></i>
                        </button>
                    </div>
                    <span id="confPassError"></span>
                </div>
                <button type="submit" id="btnsignup" class="btnsignup">SIGN UP</button>
            </form>
            <div class="footer">
                <p>already registered? <a href="login.html">LOGIN</a></p>
            </div>
        </div>
    </div>
    <script src="/js/signup.js"></script>
</body>

</html>
