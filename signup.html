<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="assests/css/signup.css">
</head>

<body>
    <div class="card-container">
        <div class="signup-card">
            <header>
                <img src="assests/images/header/Logo.png" alt="logo" />
                <h1>SIGN UP</h1>
                <p>Please fill all the details properly</p>
            </header>
            <form action="submit" method="post" autocomplete="on">
                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input type="text" class="firstname" required />
                </div>
                <div class="input-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" class="lastname" required />
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="email" required />
                </div>
                <div class="input-group">
                    <label for="pass">Password</label>
                    <input type="password" class="pass" required />
                </div>
                <div class="input-group">
                    <label for="confirmpass">Confirm Password</label>
                    <input type="password" class="confirmpassword" required />
                </div>
                <button type="submit" class="btnsignup">SIGN UP</button>
            </form>
            <div class="footer">
                <p>already registered? <a href="login.html">LOGIN</a></p>
            </div>
        </div>
    </div>
</body>

</html>
